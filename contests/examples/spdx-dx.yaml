schema_version: 1
id: spdx-dx
name: SP DX Contest (EU/DX station)
description: >-
  2026 rules: https://spdxcontest.pzk.org.pl/2026/rules.php. Profile for
  stations outside Poland: send RST plus QSO number and receive RST plus the
  Polish station's one-letter voivodeship. Each valid QSO with an SP station
  scores 3 points; each voivodeship is a multiplier per band.
bands: [160m, 80m, 40m, 20m, 15m, 10m]
modes: [CW, SSB]
cabrillo: {contest: SPDX}
exchange:
  sent:
    - {name: report, label: RST, type: rst, default: "599"}
    - {name: serial, label: QSO number, type: serial, generated: true, width: 3}
  received:
    - {name: report, label: RST, type: rst}
    - {name: province, label: SP voivodeship (one letter), type: text, pattern: "^[A-Z]$", width: 1}
scoring:
  qso_points: 0
  qso_point_rules:
    - {points: 3, when: {country: Poland}}
  multipliers:
    - {type: exchange, field: province, per_band: true}
dupe_key: [callsign, band, mode]
