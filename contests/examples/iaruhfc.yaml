schema_version: 1
id: iaruhfc
name: IARU HF Championship
description: >-
  Rules: https://contests.arrl.org/ContestRules/IARU-HF-Rules.pdf (accessed
  2026-10-18). Non-HQ stations exchange an ITU zone; HQ stations exchange
  their society abbreviation, while IARU officials exchange AC, R1, R2, or R3.
  Enter the own ITU zone in the sent ITU zone field and the other station's
  zone or HQ/official designator in the corresponding received field. QSO
  points are 1 for the same ITU zone, 3 for a different zone on the same
  continent, and 5 across continents or for an HQ/official station. Zone and
  HQ/official multipliers are tracked per band. This profile does not encode
  participant-category-specific restrictions.
bands: [160m, 80m, 40m, 20m, 15m, 10m]
modes: [CW, SSB]
cabrillo: {contest: IARU-HF}
exchange:
  sent:
    - {name: report, label: RST, type: rst, default: "599"}
    - {name: itu_zone, label: ITU Zone (station), type: integer, required: false, min: 1, max: 90}
    - {name: hq, label: HQ / official designator (station), type: text, required: false, width: 16}
  received:
    - {name: report, label: RST, type: rst}
    - {name: itu_zone, label: ITU Zone, type: integer, required: false, min: 1, max: 90}
    - {name: hq, label: HQ / official designator, type: text, required: false, width: 16}
scoring:
  qso_points: 0
  qso_point_rules:
    - {points: 5, when: {same_continent: false}}
    - {points: 5, when: {has_received.hq: true}}
    - {points: 1, when: {same_itu_zone: true}}
    - {points: 3, when: {same_itu_zone: false, same_continent: true}}
  multipliers:
    - {type: exchange, field: itu_zone, per_band: true}
    - {type: exchange, field: hq, per_band: true}
dupe_key: [callsign, band, mode]
