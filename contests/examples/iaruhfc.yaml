schema_version: 1
id: iaruhfc
name: IARU HF Championship
description: >-
  Starter profile for report and ITU zone. Enter the station zone in Sent
  exchange and verify HQ-station multipliers/scoring for the current edition.
bands: [160m, 80m, 40m, 20m, 15m, 10m]
modes: [CW, SSB]
exchange:
  sent:
    - {name: report, label: RST, type: rst, default: "599"}
    - {name: itu_zone, label: ITU Zone (station), type: integer, min: 1, max: 90}
  received:
    - {name: report, label: RST, type: rst}
    - {name: itu_zone, label: ITU Zone, type: integer, min: 1, max: 90}
scoring:
  qso_points: 1
  multipliers:
    - {type: exchange, field: itu_zone, per_band: true}
    - {type: prefix, per_band: true}
dupe_key: [callsign, band, mode]
