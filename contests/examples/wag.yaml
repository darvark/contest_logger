schema_version: 1
id: wag
name: Worked All Germany (WAG)
description: >-
  Rules: https://www.darc.de/der-club/referate/conteste/wag-contest/en/rules/.
  This profile is for non-German stations: send a serial starting at 001 and
  receive a German DOK or NM. Each valid QSO scores 1 point. Multipliers are
  counted per band and mode. The schema counts the full received DOK/NM text;
  official scoring uses its district letter and excludes NM, so multiplier
  totals are provisional. German entrants need a different exchange and
  DXCC/WAE multipliers.
bands: [80m, 40m, 20m, 15m, 10m]
modes: [CW, SSB]
cabrillo: {contest: WAG}
exchange:
  sent:
    - {name: report, label: RST, type: rst, default: "599"}
    - {name: serial, label: Serial, type: serial, generated: true, width: 3}
  received:
    - {name: report, label: RST, type: rst}
    - {name: exchange, label: DOK / NM, type: text}
scoring:
  qso_points: 1
  multipliers:
    - {type: exchange, field: exchange, per_band: true, per_mode: true}
dupe_key: [callsign, band, mode]
