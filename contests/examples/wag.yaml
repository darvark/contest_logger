schema_version: 1
id: wag
name: Worked All Germany (WAG)
description: >-
  Rules: https://www.darc.de/der-club/referate/conteste/wag-contest/en/rules/
  (2026 rules, accessed 2026-10-18). This profile is for stations outside
  Germany: send a serial starting at 001 and receive a German DOK or NM. QSOs
  with Germany score 1 point; other QSOs score 0. Multipliers use the first
  letter of a DOK (ignoring leading digits), per band and mode; NM is not a
  multiplier. German entrants need a separate profile with their own exchange
  and DXCC/WAE multiplier rules.
bands: [80m, 40m, 20m, 15m, 10m]
modes: [CW, SSB]
cabrillo: {contest: WAG}
exchange:
  sent:
    - {name: report, label: RST, type: rst, default: "599"}
    - {name: serial, label: Serial, type: serial, generated: true, width: 3}
  received:
    - {name: report, label: RST, type: rst}
    - {name: exchange, label: DOK / NM, type: text}
scoring:
  qso_points: 0
  qso_point_rules:
    - {points: 1, when: {country: Germany}}
  multipliers:
    - {type: exchange_prefix, field: exchange, per_band: true, per_mode: true}
dupe_key: [callsign, band, mode]
