schema_version: 1
id: euhfc
name: European HF Championship
description: >-
  2026 rules: https://euhf.s5cc.eu/rules/euhfc_rules_latest.pdf. European
  stations exchange RS(T) plus the last two digits of the operator's first
  official amateur-radio licence year (not birth year). Each valid European
  QSO is worth 1 point; non-European contacts score 0. Each distinct received
  licence-year value is a multiplier once per band, regardless of mode. Enter
  your own two-digit licence year in the sent exchange.
bands: [160m, 80m, 40m, 20m, 15m, 10m]
modes: [CW, SSB]
cabrillo: {contest: EUHFC}
exchange:
  sent:
    - {name: report, label: RST, type: rst, default: "599"}
    - {name: year, label: First licence year (last two digits), type: text, pattern: "^[0-9]{2}$", width: 2}
  received:
    - {name: report, label: RST, type: rst}
    - {name: year, label: First licence year (last two digits), type: text, pattern: "^[0-9]{2}$", width: 2}
scoring:
  qso_points: 0
  qso_point_rules:
    - {points: 1, when: {continent: EU}}
  multipliers:
    - {type: exchange, field: year, per_band: true}
dupe_key: [callsign, band, mode]
