schema_version: 1
id: cqww-cw
name: CQ WW DX Contest — CW
description: >-
  2026 rules: https://cqww.com/rules/. Exchange is RST plus CQ Zone. QSO points
  are 3 across continents, 1 on the same continent in different countries, 2
  between different countries in North America, and 0 within the same country.
  Both CQ Zone and country are multipliers per band. This profile tracks zones;
  country multipliers are not supported (a callsign prefix is not a country).
  QSO-point rules need both stations' locations and cannot be fully represented
  by the current schema, so the configured base point is provisional.
bands: [160m, 80m, 40m, 20m, 15m, 10m]
modes: [CW]
cabrillo: {contest: CQ-WW-CW}
exchange:
  sent:
    - {name: report, label: RST, type: rst, default: "599"}
    - {name: zone, label: CQ Zone (station), type: integer, min: 1, max: 40}
  received:
    - {name: report, label: RST, type: rst}
    - {name: zone, label: CQ Zone, type: integer, min: 1, max: 40}
scoring:
  qso_points: 1
  multipliers:
    - {type: exchange, field: zone, per_band: true}
dupe_key: [callsign, band, mode]
