schema_version: 1
id: eudx
name: European Union DX Contest
description: >-
  Rules: https://www.eudx-contest.com/rules/. EU stations send RST plus a
  two-letter/two-digit region code; other stations send RST plus ITU zone. Enter
  the applicable sent and received field manually. Each country is counted as
  a multiplier per band; EU-region multipliers are not automatically scored.
  QSO points depend on EU membership, which this schema and CTY data cannot
  identify reliably, so the configured one point is a placeholder. The profile
  is not a certified score calculator for any entrant category.
bands: [160m, 80m, 40m, 20m, 15m, 10m]
modes: [CW, SSB]
cabrillo: {contest: EUDXC}
exchange:
  sent:
    - {name: report, label: RST, type: rst, default: "599"}
    - {name: region, label: EU region (station), type: text, required: false, pattern: "^[A-Z]{2}[0-9]{2}$", width: 4}
    - {name: itu_zone, label: ITU Zone (station), type: integer, required: false, min: 1, max: 90}
  received:
    - {name: report, label: RST, type: rst}
    - {name: region, label: EU region, type: text, required: false, pattern: "^[A-Z]{2}[0-9]{2}$", width: 4}
    - {name: itu_zone, label: ITU Zone, type: integer, required: false, min: 1, max: 90}
scoring:
  qso_points: 1
  multipliers:
    - {type: dxcc, per_band: true}
dupe_key: [callsign, band, mode]
